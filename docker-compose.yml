version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: NewsandVulSBE
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kalpa2004@
      POSTGRES_DB: threatintel_db
